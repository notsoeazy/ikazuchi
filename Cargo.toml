[workspace]
resolver = "2"
members = [
    "crates/ikazuchi-core",
    "crates/ikazuchi-dex",
    "crates/ikazuchi-db",
    "crates/ikazuchi-sync",
    "crates/ikazuchi-archive",
    "app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
authors = ["Ikazuchi Contributors"]

[workspace.dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
async-trait = "0.1"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "cookies"] }
scraper = "0.20"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
flate2 = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }

ikazuchi-core = { path = "crates/ikazuchi-core" }
ikazuchi-dex = { path = "crates/ikazuchi-dex" }
ikazuchi-db = { path = "crates/ikazuchi-db" }
ikazuchi-sync = { path = "crates/ikazuchi-sync" }
ikazuchi-archive = { path = "crates/ikazuchi-archive" }
